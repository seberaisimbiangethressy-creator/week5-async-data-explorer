<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Explorer</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header class="bg-white border-b border-slate-200">
      <div class="mx-auto max-w-6xl px-4 py-5">
        <h1 class="text-2xl font-bold">Product Explorer</h1>
        <p class="text-sm text-slate-600">
          Browse, search, filter and sort products from the
          <a class="underline" href="https://dummyjson.com/docs/products">DummyJSON API</a>.
        </p>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-6">
      <!-- Controls: every control has a visible <label> (accessibility). -->
      <section aria-label="Search, filter and sort" class="grid gap-4 sm:grid-cols-3">
        <div>
          <label for="search" class="block text-sm font-medium mb-1">Search</label>
          <input
            id="search"
            type="search"
            placeholder="Search by title…"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:outline-2 focus:outline-indigo-500"
          />
        </div>
        <div>
          <label for="filter" class="block text-sm font-medium mb-1">Category</label>
          <select
            id="filter"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:outline-2 focus:outline-indigo-500"
          ></select>
        </div>
        <div>
          <label for="sort" class="block text-sm font-medium mb-1">Sort by</label>
          <select
            id="sort"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 focus:outline-2 focus:outline-indigo-500"
          >
            <option value="default">Default</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A–Z</option>
            <option value="rating">Rating: best first</option>
          </select>
        </div>
      </section>

      <!-- Stats bar (computed with reduce) -->
      <section id="stats" aria-label="Statistics" class="mt-6 grid grid-cols-3 gap-3"></section>

      <!-- Status message: aria-live="polite" so screen readers announce changes. -->
      <div id="status" aria-live="polite" class="mt-6"></div>

      <!-- Card grid: 1 column on phones, 2 on tablets, 3 on laptops, 4 on large screens. -->
      <ul id="grid" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></ul>
    </main>

    <!-- Details modal. The native <dialog> element handles focus trapping and Esc. -->
    <dialog
      id="details"
      aria-labelledby="details-title"
      class="m-auto w-[min(42rem,92vw)] rounded-2xl p-0 shadow-2xl"
    >
      <div id="details-content"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
